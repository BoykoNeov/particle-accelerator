      h += `<div class="field"><label for="f-shape"${tipAttr("p:shape")}${state.level === "off" ? "" : ' tabindex="0"'}>shape</label><select id="f-shape" data-key="shape"><option ${el.shape === "circular" ? "selected" : ""}>circular</option><option ${el.shape === "elliptical" ? "selected" : ""}>elliptical</option><option ${el.shape === "rectangular" ? "selected" : ""}>rectangular</option></select></div>`;
    }
    if (el.type === "RFCavity") {
      const byH = el.harmonic != null && el.harmonic !== "";
      h += `<div class="field"><label${tipAttr("p:harmonic")}${state.level === "off" ? "" : ' tabindex="0"'}>tune by</label><span class="seg"><button data-rfmode="harmonic" aria-pressed="${byH}">harmonic</button><button data-rfmode="frequency" aria-pressed="${!byH}">frequency</button></span></div>`;
      if (byH) {
        const C = state.result ? state.result.length : 0;
        const f = state.result && state.result.elements ? state.result.elements[i].frequency : 0;
        h += field("harmonic", "harmonic h", el.harmonic, "", { step: 1, aside: `f = ${fmt(f / 1e6, 6)} MHz for C = ${fmt(C, 5)} m` });
      } else h += field("frequency", "frequency", el.frequency ?? 0, "Hz", { aside: `${fmt((el.frequency || 0) / 1e6, 6)} MHz` });
    }
    for (const f of FIELDS[el.type]) {
      if (el.type === "RFCavity" && f.key === "frequency") continue;
      h += field(f.key, f.label, el[f.key] ?? "", f.unit, { step: f.step, aside: f.aside ? f.aside(+el[f.key] || 0) : (f.key === "h0" && state.result && state.result.ref ? `B̂ = ${fmt((+el.h0 || 0) * state.result.ref.brho, 4)} T · L = ${fmt(O.elementLength(el), 4)} m` : "") });
    }
    if (el.type === "Dipole") {
      const rho = el.angle ? el.length / el.angle : Infinity;
      h += `<div class="field"><label></label><div class="inline"><button class="btn sm" data-act="rect">rectangular faces</button><button class="btn sm" data-act="sector">sector faces</button></div><div class="aside">ρ = ${fmt(rho, 5)} m · h = ${fmt(el.length ? el.angle / el.length : 0, 4)} /m${el.fringe ? " · hard-edge fringe on" : ""}</div></div>`;
      h += `<div class="field"><label for="f-fringe"${tipAttr("p:fringe")}${state.level === "off" ? "" : ' tabindex="0"'}>fringe</label><div class="inline"><input id="f-fringe" type="checkbox" data-key="fringe" ${el.fringe ? "checked" : ""}><small style="color:var(--ink-3)">hard-edge fringe (tracking only; the linear map is blind to it)</small></div></div>`;
    }
    if (spec.align && spec.align.length && !(el.type === "Dipole")) {
      h += `<h2 style="margin-top:10px"><span class="label"${tipAttr("p:align")}>Misalignment</span></h2>`;
      if (spec.align.includes("dx")) h += field("dx", "dx", el.dx ?? 0, "m", { step: 1e-4 }) + field("dy", "dy", el.dy ?? 0, "m", { step: 1e-4 });
      if (spec.align.includes("roll")) h += field("roll", "roll", el.roll ?? 0, "rad", { step: 1e-3 });
    }
    if (errs.length) h += `<div class="errs">${errs.map(esc).join("<br>")}</div>`;
    h += opsHTML();
    host.innerHTML = h;
    bindFields(host);
    bindOps(host);
    host.querySelectorAll("[data-rfmode]").forEach((b) => b.addEventListener("click", () => {
      const mode = b.dataset.rfmode;
      commit(() => {
        const e = state.scenario.elements[i];
        if (mode === "harmonic") { const C = state.result.length; const f = e.frequency || 0; e.harmonic = Math.max(1, Math.round(f * C / (state.result.ref.beta0 * O.CLIGHT))) || 100; delete e.frequency; }
        else { e.frequency = state.result.elements[i].frequency; delete e.harmonic; }
      }, `Cavity set by ${mode}`);
      renderInspector();
    }));
    host.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => {
      const act = b.dataset.act;
      commit(() => { const e = state.scenario.elements[i]; if (act === "rect") { e.e1 = e.angle / 2; e.e2 = e.angle / 2; } else { e.e1 = 0; e.e2 = 0; } }, act === "rect" ? "Pole faces set to a rectangular bend" : "Pole faces set to a sector bend");
      renderInspector();
    }));
    const fr = host.querySelector("#f-fringe");
    if (fr) fr.addEventListener("change", () => commit(() => { state.scenario.elements[i].fringe = fr.checked; }, fr.checked ? "Fringe on" : "Fringe off"));
  }
  function opsHTML() {
    return `<div class="ops"><button class="btn" data-op="dup" title="Ctrl+D">Duplicate</button><span class="rep"><button class="btn" data-op="rep">Repeat ×</button><input type="number" min="2" max="200" step="1" value="4" id="rep-n" aria-label="times"></span><button class="btn" data-op="mirror" title="Append the selection reversed">Mirror</button><button class="btn" data-op="left" title="Shift+←">←</button><button class="btn" data-op="right" title="Shift+→">→</button><button class="btn danger" data-op="del" title="Delete">Remove</button></div>`;
  }
  function bindOps(host) {
    host.querySelectorAll("[data-op]").forEach((b) => b.addEventListener("click", () => {
      const op = b.dataset.op;
      if (op === "dup") duplicateSel(1); else if (op === "rep") duplicateSel(+$("rep-n").value); else if (op === "mirror") mirrorSel();
      else if (op === "left") moveSel(-1); else if (op === "right") moveSel(1); else if (op === "del") deleteSel();
    }));
  }
  function bindFields(host) {
    host.querySelectorAll("input[data-key], select[data-key]").forEach((inp) => {
      let before = null;
      inp.addEventListener("focus", () => { before = snapshot(); });
      const apply = (final) => {
        const key = inp.dataset.key, scope = inp.dataset.scope || "element";
        const raw = inp.type === "number" ? (inp.value === "" ? "" : +inp.value) : inp.value;
        if (inp.type === "number" && inp.value !== "" && !Number.isFinite(raw)) { inp.classList.add("err"); return; }
        inp.classList.remove("err");
        if (scope === "element") { const el = state.scenario.elements[state.sel[0]]; if (!el) return; el[key] = raw; }
        else if (scope === "reference") {
          const ref = state.scenario.reference;
          if (key === "energy_GeV") ref.energy_eV = raw === "" ? 0 : raw * 1e9;
          else if (key === "species") { ref.species = raw; if (raw === "custom") { ref.mass_eV = ref.mass_eV ?? O.PROTON_MASS_EV; ref.charge = ref.charge ?? 1; } else { delete ref.mass_eV; delete ref.charge; } }
          else ref[key] = raw;
        } else if (scope === "twiss") state.scenario.initial_twiss[key] = raw === "" ? 0 : raw;
        else if (scope === "beam") { const b = state.scenario.beam; if (key === "emit_x_nm") b.emit_x = raw * 1e-9; else if (key === "emit_y_nm") b.emit_y = raw * 1e-9; else if (key === "sigma_delta_pm") b.sigma_delta = raw * 1e-3; }
        recompute(); renderAll();
        // live asides
        const el = state.scenario.elements[state.sel[0]];
        host.querySelectorAll("[data-aside]").forEach((a) => {
          const f = el && FIELDS[el.type].find((ff) => ff.key === a.dataset.aside);
          if (f && f.aside) a.textContent = f.aside(+el[f.key] || 0);
          else if (a.dataset.aside === "h0" && el && state.result.ref) a.textContent = `B̂ = ${fmt((+el.h0 || 0) * state.result.ref.brho, 4)} T · L = ${fmt(O.elementLength(el), 4)} m`;
          else if (a.dataset.aside === "harmonic" && state.result && state.result.elements) a.textContent = `f = ${fmt(state.result.elements[state.sel[0]].frequency / 1e6, 6)} MHz for C = ${fmt(state.result.length, 5)} m`;
          else if (a.dataset.aside === "frequency" && el) a.textContent = `${fmt((el.frequency || 0) / 1e6, 6)} MHz`;
        });
        if (final) { if (before !== null && before !== snapshot()) { history.push(before); future.length = 0; } before = snapshot(); save(); if (inp.tagName === "SELECT" || key === "name" || key === "shape") renderInspector(); }
      };
      inp.addEventListener("input", () => apply(false));
      inp.addEventListener("change", () => apply(true));
    });
  }
  function renderSeq() {
    const sc = state.scenario, r = state.result;
    const host = $("seq");
    const errIdx = new Set();
    if (r && r.errors.length) r.errors.forEach((m) => { const mm = /#(\d+):/.exec(m); if (mm) errIdx.add(+mm[1] - 1); });
    host.innerHTML = sc.elements.map((el, i) => `<li data-i="${i}" class="${state.sel.includes(i) ? "sel" : ""}${errIdx.has(i) ? " err" : ""}"><span class="idx">${i + 1}</span><span class="dot" style="background:var(${TYPES[el.type].color})"></span><span class="nm">${esc(el.name || "")}</span><span class="ty">${TYPES[el.type].label}</span><span class="ln">${O.elementLength(el) ? fmt(O.elementLength(el), 4) + " m" : "thin"}</span></li>`).join("");
    $("seqcount").textContent = `${sc.elements.length} · ${fmt(r ? r.length : 0, 5)} m`;
    host.querySelectorAll("li").forEach((li) => li.addEventListener("click", (e) => select(+li.dataset.i, e)));
    const selLi = host.querySelector("li.sel");
    if (selLi && state.sel.length === 1) selLi.scrollIntoView({ block: "nearest" });
  }
  function renderInspector() { renderMachine(); renderElement(); renderSeq(); }
  function renderAll() {
    renderSummary(); renderGuide(); renderPlot(); renderSeq();
    $("btn-undo").disabled = !history.length; $("btn-redo").disabled = !future.length;
    $("name").value = state.scenario.name || "";
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === state.tab)));
    $("zoom").parentElement.style.visibility = ["optics", "envelope", "orbit"].includes(state.tab) ? "" : "hidden";
  }

  // ------------------------------------------------------------- import / export
  function toPython(sc) {
    const r = state.result, ref = sc.reference;
    const py = (v) => { const s = String(+v); return /[.e]/.test(s) ? s : s + ".0"; };
    const q = (s) => JSON.stringify(s);
    const massExpr = { electron: "ac.ELECTRON_MASS_EV", positron: "ac.ELECTRON_MASS_EV", proton: "ac.PROTON_MASS_EV" }[ref.species] || py(ref.mass_eV);
    const charge = O.SPECIES[ref.species] ? O.SPECIES[ref.species].charge : (ref.charge ?? 1);
    const ctor = { total: "from_total_energy", kinetic: "from_kinetic_energy", momentum: "from_momentum" }[ref.energy_mode || "total"];
    const L = [];
    L.push(`"""${sc.name} — exported from the accsim lattice editor.`);
    if (sc.description) L.push("", sc.description);
    L.push('', 'The same machine as data: ac.load_scenario("<file>.accsim.json").lattice', '"""', "", "import accsim as ac", "");
    L.push(`ref = ac.ReferenceParticle.${ctor}(${massExpr}, ${py(ref.energy_eV)}, charge=${py(charge)})`);
    L.push(`CIRCUMFERENCE = ${py(r ? r.length : 0)}  # m, total length of the sequence below`, "", "elements = [");
    for (const e of sc.elements) {
      const name = e.name ? `, name=${q(e.name)}` : "";
      const al = ["dx", "dy", "roll"].filter((k) => +e[k]).map((k) => `, ${k}=${py(e[k])}`).join("");
      let line;
      switch (e.type) {
        case "Drift": line = `ac.Drift(${py(e.length)}${name}${al})`; break;
        case "Quadrupole": line = `ac.Quadrupole(${py(e.length)}, ${py(e.k1)}${name}${al})`; break;
        case "ThinQuadrupole": line = `ac.ThinQuadrupole(${py(e.k1l)}${name}${al})`; break;
        case "Dipole": line = `ac.Dipole(${py(e.length)}, ${py(e.angle)}${+e.k1 ? `, k1=${py(e.k1)}` : ""}${+e.e1 ? `, e1=${py(e.e1)}` : ""}${+e.e2 ? `, e2=${py(e.e2)}` : ""}${name}${e.fringe ? ", fringe=True" : ""}${al})`; break;
        case "Sextupole": line = `ac.Sextupole(${py(e.length)}, ${py(e.k2)}${name}${al})`; break;
        case "ThinSextupole": line = `ac.ThinSextupole(${py(e.k2l)}${name}${al})`; break;
        case "Octupole": line = `ac.Octupole(${py(e.length)}, ${py(e.k3)}${name}${al})`; break;
        case "ThinOctupole": line = `ac.ThinOctupole(${py(e.k3l)}${name}${al})`; break;
        case "SkewQuadrupole": line = `ac.SkewQuadrupole(${py(e.length)}, ${py(e.k1s)}${name}${al})`; break;
        case "ThinSkewQuadrupole": line = `ac.ThinSkewQuadrupole(${py(e.k1sl)}${name}${al})`; break;
        case "Solenoid": line = `ac.Solenoid(${py(e.length)}, ${py(e.ks)}${name}${al})`; break;
        case "RFCavity": line = e.harmonic != null && e.harmonic !== "" ? `ac.RFCavity.from_harmonic(${py(e.voltage)}, ${Math.round(e.harmonic)}, CIRCUMFERENCE, ref, phi_s=${py(e.phi_s || 0)}${name})` : `ac.RFCavity(${py(e.voltage)}, ${py(e.frequency || 0)}, phi_s=${py(e.phi_s || 0)}${name})`; break;
        case "Corrector": line = `ac.Corrector(${py(e.kick_x || 0)}, ${py(e.kick_y || 0)}${name}${al})`; break;
        case "Wiggler": line = `ac.Wiggler(${py(e.period)}, ${py(e.h0)}, ${Math.round(e.periods)}${name}${al})`; break;
        case "Aperture": case "Collimator": line = `ac.${e.type}(${q(e.shape)}, ${py(e.half_x)}${e.half_y != null && e.half_y !== "" ? `, ${py(e.half_y)}` : ""}, length=${py(e.length || 0)}${name})`; break;
        default: line = `# unsupported ${e.type}`;
      }
      L.push(`    ${line},`);
    }
    L.push("]", "lattice = ac.Lattice(elements, ref)", "");
    if (sc.periodic) {
      L.push("tw = ac.closed_twiss(lattice)", 'print("tunes", ac.tunes(lattice))', 'print("chromaticity", ac.chromaticity(lattice))', 'print("momentum compaction", ac.momentum_compaction(lattice))');
      if (sc.elements.some((e) => e.type === "RFCavity")) L.push('print("synchrotron tune", ac.synchrotron_tune(lattice))');
    } else {
      const t = sc.initial_twiss;
      L.push(`tw0 = ac.Twiss(0.0, ${py(t.beta_x)}, ${py(t.alpha_x)}, 0.0, ${py(t.beta_y)}, ${py(t.alpha_y)}, 0.0, ${py(t.disp_x)}, ${py(t.disp_px)})`, "points = ac.propagate_twiss(lattice, tw0)", 'print("exit beta", points[-1].beta_x, points[-1].beta_y)');
    }
    return L.join("\n") + "\n";
  }
  function fileStem() { return (state.scenario.name || "machine").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "machine"; }
  function openExport(kind) {
    const dlg = $("dlg-export");
    const isPy = kind === "python";
    const text = isPy ? toPython(state.scenario) : JSON.stringify(exportable(state.scenario), null, 2) + "\n";
    $("dlg-export-title").textContent = isPy ? "Python script" : "Scenario JSON";
    $("dlg-export-text").innerHTML = isPy ? "The same machine built with the package's classes. Run it in the project environment; every number the editor shows is what these calls compute." : `Save this as <span class="mono">${fileStem()}.accsim.json</span> and open it in Python with <span class="mono">ac.load_scenario(path).lattice</span>, or import it back here.`;
    $("dlg-export-body").value = text;
    $("dlg-export-note").textContent = `${text.length.toLocaleString()} characters`;
    dlg._filename = fileStem() + (isPy ? ".py" : ".accsim.json");
    dlg._mime = isPy ? "text/x-python" : "application/json";
    dlg.showModal();
  }
  async function copyText(text, okMsg) {
    try { await navigator.clipboard.writeText(text); status(okMsg || "Copied", "good"); return true; }
    catch (e) { status("Copy blocked by the browser — select the text and copy it by hand", "bad"); return false; }
  }
  async function download(text, name, mime) {
    // Published on claude.ai the page cannot start a download itself; the viewer's
    // `downloads` capability saves the file after the viewer confirms. Elsewhere
    // (a local copy of this file) a plain blob link does the job.
    let saver = null;
    if (window.claude && typeof window.claude.use === "function") {
      try { saver = await window.claude.use("downloads"); } catch (e) { saver = null; }
    }
    if (saver) {
      const fname = /\.(json|txt|md|html|csv)$/i.test(name) ? name : name + ".txt";
      try { await saver.save({ filename: fname, data: text }); status(`Saved ${fname}`, "good"); }
      catch (e) { if (e && e.code === "declined") status("Save cancelled"); else status(`Could not save: ${(e && e.message) || e}`, "bad"); }
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    status(`Download started: ${name} (if nothing arrived, this page's host blocks downloads — use Copy)`);
  }
  function importText(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { throw new Error("not valid JSON: " + e.message); }
    if (!data || typeof data !== "object") throw new Error("the document is not an object");
    if (data.format && data.format !== "accsim-scenario/1") throw new Error(`unsupported format ${data.format}`);
    if (!Array.isArray(data.elements)) throw new Error('missing an "elements" list');
    for (const [i, e] of data.elements.entries()) if (!O.CATALOGUE[e.type]) throw new Error(`element ${i + 1}: unknown type ${e.type}`);
    loadScenario(data, `Imported "${data.name || "untitled"}"`);
  }
  function loadScenario(data, msg) {
    pushHistory();
    state.scenario = normalise(data);
    state.sel = []; state.anchor = null;
    afterChange(msg);
    renderInspector();
  }
  function shareLink() {
    const json = JSON.stringify(exportable(state.scenario));
    const b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    const url = location.href.split("#")[0] + "#s=" + b64;
    copyText(url, `Link copied (${(url.length / 1024).toFixed(1)} kB) — it carries the whole machine`);
  }
  function fromHash() {
    const m = /#s=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (!m) return null;
    try { const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/"); return JSON.parse(decodeURIComponent(escape(atob(b64)))); } catch (e) { return null; }
  }

  // ------------------------------------------------------------- wiring
  function wire() {
    $("teach").innerHTML = TEACH.LEVELS.map((l) => `<option value="${l.id}">${esc(l.label)}</option>`).join("");
    $("teach").addEventListener("change", () => { state.guideHidden = false; setLevel($("teach").value); });
    // One delegated pair of listeners: the DOM under them is rebuilt constantly.
    document.addEventListener("pointerover", onTipEnter);
    document.addEventListener("focusin", onTipEnter);
    document.addEventListener("pointerdown", hideTip);
    window.addEventListener("scroll", hideTip, true);
    window.addEventListener("blur", hideTip);

    $("presets").innerHTML = `<option value="">Presets…</option>` + PRESETS.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
    $("presets").addEventListener("change", () => {
      const p = PRESETS.find((x) => x.id === $("presets").value);
      if (p) loadScenario(clone(p), `Loaded preset "${p.name}"`);
      $("presets").value = "";
    });
    $("btn-new").addEventListener("click", () => loadScenario(blankScenario(), "New empty machine — add elements from the palette"));
    $("btn-undo").addEventListener("click", undo);
    $("btn-redo").addEventListener("click", redo);
    $("btn-export").addEventListener("click", () => openExport("json"));
    $("btn-python").addEventListener("click", () => openExport("python"));
    $("btn-share").addEventListener("click", shareLink);
    $("btn-import").addEventListener("click", () => { $("dlg-import-err").textContent = ""; $("dlg-import-body").value = ""; $("dlg-import").showModal(); });
    $("name").addEventListener("change", () => commit(() => { state.scenario.name = $("name").value; }, "Renamed"));
    $("dlg-export-close").addEventListener("click", () => $("dlg-export").close());
    $("dlg-export-copy").addEventListener("click", () => copyText($("dlg-export-body").value, "Copied to the clipboard"));
    $("dlg-export-download").addEventListener("click", () => download($("dlg-export-body").value, $("dlg-export")._filename, $("dlg-export")._mime));
    $("dlg-import-close").addEventListener("click", () => $("dlg-import").close());
    $("dlg-import-ok").addEventListener("click", () => {
      try { importText($("dlg-import-body").value); $("dlg-import").close(); }
      catch (e) { $("dlg-import-err").textContent = e.message; $("dlg-import-err").style.color = "var(--bad)"; }
    });
    $("dlg-import-file").addEventListener("change", () => {
      const f = $("dlg-import-file").files[0]; if (!f) return;
      const rd = new FileReader(); rd.onload = () => { $("dlg-import-body").value = rd.result; }; rd.readAsText(f);
    });
    document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => { state.tab = t.dataset.tab; renderAll(); save(); }));
    $("zoom").addEventListener("input", () => { state.zoom = +$("zoom").value; renderPlot(); });
    const scroll = $("plotscroll");
    scroll.addEventListener("pointermove", onPlotMove);
    scroll.addEventListener("pointerleave", onPlotLeave);
    window.addEventListener("resize", () => renderPlot());
    window.addEventListener("keydown", (e) => {
      const tag = (e.target.tagName || "").toLowerCase();
      const typing = tag === "input" || tag === "textarea" || tag === "select";
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
      if (typing) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "d") { e.preventDefault(); duplicateSel(1); return; }
      if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteSel(); return; }
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault();
        const d = e.key === "ArrowLeft" ? -1 : 1;
        if (e.shiftKey) moveSel(d);
        else if (state.sel.length) select(Math.max(0, Math.min(state.scenario.elements.length - 1, (state.anchor ?? state.sel[0]) + d)));
        else if (state.scenario.elements.length) select(0);
      }
      if (e.key === "Escape") { hideTip(); state.sel = []; renderAll(); renderInspector(); }
    });
  }

  function boot() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { saved = null; }
    // The level is restored before anything renders, so the palette captions and
    // the tips come up at the right level on the first paint. A share link never
    // carries it: it is a preference of this browser, not of the machine.
    if (saved && saved.level && TEACH.LEVELS.some((l) => l.id === saved.level)) state.level = saved.level;
    document.body.dataset.level = state.level;
    renderPalette();
    wire();
    $("teach").value = state.level;
    let data = fromHash(), msg = "Loaded the machine carried by this link";
    if (!data && saved && saved.scenario) { data = saved.scenario; state.tab = saved.tab || "optics"; msg = "Restored your last machine"; }
    if (!data) {
      data = clone(PRESETS.find((p) => p.id === "electron-ring"));
      msg = state.level === "off"
        ? "Loaded the electron storage ring preset — pick another under Presets"
        : "Loaded the electron storage ring preset — hover anything to have it explained, or open the Learn tab";
    }
    state.scenario = normalise(data);
    recompute(); renderAll(); renderInspector(); status(msg);
    if (location.hash) history.length = 0;
  }
  boot();
})();
</script>

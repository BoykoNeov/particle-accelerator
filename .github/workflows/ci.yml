name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + analytic suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (dev extras only — reference deps are intentionally absent)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Analytic test suite
        # `-m "not reference"` comes from pyproject addopts, so the xtrack/MAD-X
        # cross-checks are deselected here (they would have skipped anyway — the
        # deps are not installed). Deliberately serial: the costly analytic tests
        # are sympy derivations whose peak memory multiplies per xdist worker, and
        # an 8-way local run exhausted the commit limit. See docs/CONVENTIONS.md
        # → Test-suite cost before adding `-n` here.
        run: pytest -ra
